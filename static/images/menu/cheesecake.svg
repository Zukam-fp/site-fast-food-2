<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .assiette { fill: #F5F5F5; }
    .assiette-contour { fill: none; stroke: #DDDDDD; stroke-width: 1; }
    .base-biscuit { fill: #CD853F; }
    .cheese { fill: #FFF8DC; }
    .coulis { fill: #C71585; }
    .framboise { fill: #FF2D7A; }
    .fraise { fill: #FF3347; }
    .myrtille { fill: #4B3B8F; }
    .menthe { fill: #00A651; }
    
    .cheesecake-container {
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
  
  <g class="cheesecake-container" transform="translate(50, 60)">
    <!-- Assiette -->
    <ellipse class="assiette" cx="100" cy="180" rx="90" ry="20" />
    <ellipse class="assiette-contour" cx="100" cy="180" rx="85" ry="18" />
    
    <!-- Part de cheesecake -->
    <g transform="translate(60, 80)">
      <!-- Base biscuit -->
      <path class="base-biscuit" d="M0 90 L80 90 L80 100 L0 100 Z" />
      
      <!-- Cream cheese -->
      <path class="cheese" d="M0 40 L80 40 L80 90 L0 90 Z" />
      
      <!-- Séparation entre parts -->
      <path class="assiette-contour" d="M0 40 L0 100" />
      <path class="assiette-contour" d="M80 40 L80 100" />
      <path class="assiette-contour" d="M0 40 L80 40" />
      <path class="assiette-contour" d="M0 90 L80 90" />
      
      <!-- Coulis de fruits rouges -->
      <path class="coulis" d="M0 40 L80 40 C75 35, 65 38, 60 33 C55 28, 45 25, 35 37 C25 42, 10 35, 0 40 Z" />
    </g>
    
    <!-- Fruits rouges déco -->
    <circle class="fraise" cx="65" cy="70" r="8" />
    <circle class="fraise" cx="90" cy="75" r="7" />
    <circle class="fraise" cx="130" cy="65" r="8" />
    
    <circle class="framboise" cx="75" cy="60" r="5" />
    <circle class="framboise" cx="110" cy="70" r="6" />
    <circle class="framboise" cx="140" cy="75" r="5" />
    
    <circle class="myrtille" cx="80" cy="80" r="4" />
    <circle class="myrtille" cx="100" cy="65" r="3" />
    <circle class="myrtille" cx="120" cy="80" r="4" />
    
    <!-- Feuilles de menthe -->
    <path class="menthe" d="M95 55 Q 100 50, 105 55 Q 110 50, 115 55 Q 110 60, 105 55 Q 100 60, 95 55 Z" />
    <path class="menthe" d="M97 53 L97 60" stroke="#00A651" stroke-width="1" />
  </g>
</svg>