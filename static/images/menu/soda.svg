<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bouteille { fill: #F5F5F5; }
    .bouteille-contour { fill: none; stroke: #DDDDDD; stroke-width: 1; }
    .soda-cola { fill: #3A1C0E; }
    .soda-citron { fill: #FFFF66; }
    .soda-gingembre { fill: #DAA520; }
    .bulles { fill: #FFFFFF; opacity: 0.7; }
    .bouchon { fill: #E53935; }
    .etiquette { fill: #E53935; }
    .etiquette-texte { fill: #FFFFFF; font-family: Arial; font-size: 12px; }
    
    .soda-container {
      animation: float 3s ease-in-out infinite;
    }
    
    .bulles circle {
      animation: rise 3s infinite;
      animation-timing-function: ease-out;
    }
    
    .bulles circle:nth-child(2n) {
      animation-delay: 0.5s;
    }
    
    .bulles circle:nth-child(3n) {
      animation-delay: 1s;
    }
    
    .bulles circle:nth-child(5n) {
      animation-delay: 1.5s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    @keyframes rise {
      0% { 
        transform: translateY(0);
        opacity: 0;
      }
      50% { 
        opacity: 0.7;
      }
      100% { 
        transform: translateY(-40px);
        opacity: 0;
      }
    }
  </style>
  
  <g class="soda-container" transform="translate(30, 30)">
    <!-- Bouteille de Cola -->
    <g transform="translate(0, 0)">
      <!-- Bouteille -->
      <path class="bouteille" d="M30 50 L40 60 Q 40 70, 45 80 L45 200 Q 40 210, 30 220 L70 220 Q 60 210, 55 200 L55 80 Q 60 70, 60 60 L70 50 L70 30 L60 20 L40 20 L30 30 Z" />
      <path class="bouteille-contour" d="M40 60 Q 40 70, 45 80" />
      <path class="bouteille-contour" d="M60 60 Q 60 70, 55 80" />
      <path class="bouteille-contour" d="M45 200 Q 40 210, 30 220" />
      <path class="bouteille-contour" d="M55 200 Q 60 210, 70 220" />
      
      <!-- Bouchon -->
      <rect class="bouchon" x="40" y="20" width="20" height="10" rx="2" />
      
      <!-- Liquide de cola -->
      <path class="soda-cola" d="M45 80 L55 80 L55 200 Q 50 205, 45 200 Z" />
      
      <!-- Bulles -->
      <g class="bulles">
        <circle cx="48" cy="180" r="1" />
        <circle cx="52" cy="190" r="1.5" />
        <circle cx="47" cy="170" r="1" />
        <circle cx="51" cy="160" r="2" />
        <circle cx="49" cy="150" r="1" />
        <circle cx="53" cy="140" r="1.5" />
        <circle cx="47" cy="130" r="1" />
        <circle cx="51" cy="120" r="1" />
      </g>
      
      <!-- Étiquette -->
      <rect class="etiquette" x="38" y="120" width="24" height="60" rx="2" />
      <text class="etiquette-texte" x="50" y="145" text-anchor="middle">COLA</text>
    </g>
    
    <!-- Bouteille de Citron -->
    <g transform="translate(80, 0)">
      <!-- Bouteille -->
      <path class="bouteille" d="M30 50 L40 60 Q 40 70, 45 80 L45 200 Q 40 210, 30 220 L70 220 Q 60 210, 55 200 L55 80 Q 60 70, 60 60 L70 50 L70 30 L60 20 L40 20 L30 30 Z" />
      <path class="bouteille-contour" d="M40 60 Q 40 70, 45 80" />
      <path class="bouteille-contour" d="M60 60 Q 60 70, 55 80" />
      <path class="bouteille-contour" d="M45 200 Q 40 210, 30 220" />
      <path class="bouteille-contour" d="M55 200 Q 60 210, 70 220" />
      
      <!-- Bouchon -->
      <rect class="bouchon" x="40" y="20" width="20" height="10" rx="2" />
      
      <!-- Liquide de citron -->
      <path class="soda-citron" d="M45 80 L55 80 L55 200 Q 50 205, 45 200 Z" />
      
      <!-- Bulles -->
      <g class="bulles">
        <circle cx="48" cy="180" r="1" />
        <circle cx="52" cy="190" r="1.5" />
        <circle cx="47" cy="170" r="1" />
        <circle cx="51" cy="160" r="2" />
        <circle cx="49" cy="150" r="1" />
        <circle cx="53" cy="140" r="1.5" />
        <circle cx="47" cy="130" r="1" />
        <circle cx="51" cy="120" r="1" />
      </g>
      
      <!-- Étiquette -->
      <rect class="etiquette" x="38" y="120" width="24" height="60" rx="2" />
      <text class="etiquette-texte" x="50" y="145" text-anchor="middle">LEMON</text>
    </g>
    
    <!-- Bouteille de Gingembre -->
    <g transform="translate(160, 0)">
      <!-- Bouteille -->
      <path class="bouteille" d="M30 50 L40 60 Q 40 70, 45 80 L45 200 Q 40 210, 30 220 L70 220 Q 60 210, 55 200 L55 80 Q 60 70, 60 60 L70 50 L70 30 L60 20 L40 20 L30 30 Z" />
      <path class="bouteille-contour" d="M40 60 Q 40 70, 45 80" />
      <path class="bouteille-contour" d="M60 60 Q 60 70, 55 80" />
      <path class="bouteille-contour" d="M45 200 Q 40 210, 30 220" />
      <path class="bouteille-contour" d="M55 200 Q 60 210, 70 220" />
      
      <!-- Bouchon -->
      <rect class="bouchon" x="40" y="20" width="20" height="10" rx="2" />
      
      <!-- Liquide de gingembre -->
      <path class="soda-gingembre" d="M45 80 L55 80 L55 200 Q 50 205, 45 200 Z" />
      
      <!-- Bulles -->
      <g class="bulles">
        <circle cx="48" cy="180" r="1" />
        <circle cx="52" cy="190" r="1.5" />
        <circle cx="47" cy="170" r="1" />
        <circle cx="51" cy="160" r="2" />
        <circle cx="49" cy="150" r="1" />
        <circle cx="53" cy="140" r="1.5" />
        <circle cx="47" cy="130" r="1" />
        <circle cx="51" cy="120" r="1" />
      </g>
      
      <!-- Étiquette -->
      <rect class="etiquette" x="38" y="120" width="24" height="60" rx="2" />
      <text class="etiquette-texte" x="50" y="145" text-anchor="middle">GINGER</text>
    </g>
  </g>
</svg>